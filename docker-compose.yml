services:
  php:
    build:
      context : ./
      dockerfile : Dockerfile
    volumes:
      - ./:/code:delegated
    working_dir: /code
    container_name: prodigyview
    depends_on:
      mysql:
        condition: service_healthy
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_healthy

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: prodigyview
      MYSQL_USER: prodigyview
      MYSQL_PASSWORD: prodigyview
      MYSQL_ROOT_PASSWORD: prodigyviewroot
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u prodigyview -pprodigyview --silent"]
      interval: 5s
      timeout: 5s
      retries: 30

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: prodigyview
      POSTGRES_USER: prodigyview
      POSTGRES_PASSWORD: prodigyview
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prodigyview -d prodigyview"]
      interval: 5s
      timeout: 5s
      retries: 30

  mongodb:
    image: mongo:8.0
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: prodigyviewroot
    volumes:
      - ./docker/mongo/initdb.d:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet 'mongodb://prodigyview:prodigyview@localhost:27017/prodigyview' --eval 'db.runCommand({ ping: 1 }).ok'"]
      interval: 5s
      timeout: 5s
      retries: 30
